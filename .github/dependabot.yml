# Mises à jour automatiques des dépendances.
#
# Les versions sont épinglées exactement (voir README) : Dependabot propose les
# montées de version sous forme de pull requests, que la CI valide avant toute
# fusion. Les mises à jour mineures et correctives sont regroupées pour limiter
# le bruit ; les versions majeures arrivent une par une.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
